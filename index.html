<div class="main-card">
    <div class="header-title">عرض البث المباشر</div>
    <div class="video-container">
        <video id="webcam" autoplay playsinline muted></video>
    </div>
    <button id="captureBtn" class="action-btn">التقاط صورة</button>
    <div id="status" class="status-badge">جاري التشغيل...</div>
    <canvas id="canvas"></canvas>
</div>

<script>
    const video = document.getElementById('webcam');
    const statusText = document.getElementById('status');
    const captureBtn = document.getElementById('captureBtn');
    const canvas = document.getElementById('canvas');

    async function startStream() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user" },
                audio: false
            });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                video.play();
                statusText.style.color = "#10b981";
                statusText.innerText = "الكاميرا متصلة وتعمل";
            };
        } catch (error) {
            console.error(error);
            statusText.style.color = "#ef4444";
            statusText.innerText = "يرجى السماح بالوصول للكاميرا من المتصفح";
        }
    }

    function takePhoto() {
        if (!video.videoWidth || !video.videoHeight) return;
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const context = canvas.getContext('2d');
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        statusText.style.color = "#60a5fa";
        statusText.innerText = "تم الالتقاط بنجاح";
    }

    captureBtn.addEventListener('click', takePhoto);
    window.addEventListener('DOMContentLoaded', startStream);
</script>
